# Manual trigger only — nothing runs on push or PR. See ADR-0006.
# Run from the Actions tab, or:  gh workflow run ci.yml
name: CI

on:
  workflow_dispatch:
    inputs:
      split:
        description: "Dataset split to evaluate"
        required: false
        default: "dev"
        type: choice
        options: [dev, test]

jobs:
  ci:
    runs-on: ubuntu-latest
    container: swift:6.4.3-noble
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Replay mode: offline, deterministic, free. No API keys needed —
      # category labels are derived from the committed corpus.
      - name: Eval
        run: make eval

      - name: Regression gate
        run: make gate

      - name: Scorecard
        run: make scorecard

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-${{ inputs.split }}
          path: eval/runs/
