# Manual trigger only — nothing runs on push or PR. See ADR-0006.
# Run from the Actions tab, or:  gh workflow run ci.yml
name: CI

on:
  workflow_dispatch:
    inputs:
      split:
        description: "Dataset split to evaluate"
        required: false
        default: "dev"
        type: choice
        options: [dev, test]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Not `container: swift:6.4.3-noble`. That image has neither python3
      # nor make, so `make eval` — and therefore the gate — could not run at
      # all. CI is manual-trigger only, so this had never been exercised.
      - name: Build CI image
        run: make ci-image

      # The same `make ci` a developer runs locally, in the same image.
      # Replay mode: offline, deterministic, free. No API keys — category
      # labels are derived from the committed corpus.
      - name: CI (lint, test, eval, regression gate)
        run: make ci-linux SPLIT=${{ inputs.split }}

      - name: Scorecard
        run: |
          docker run --rm -v "$PWD":/src -w /src brain-ci:6.4.3 \
            make scorecard SCRATCH=.build-linux SPLIT=${{ inputs.split }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-${{ inputs.split }}
          path: eval/runs/
